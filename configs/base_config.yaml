# Base Configuration for SLM Fine-Tuning with LoRA/QLoRA

experiment:
  name: "slm-qlora-baseline"
  description: "Baseline QLoRA fine-tuning run on target task"
  seed: 42
  tags: ["qlora", "slm", "baseline"]

model:
  # Candidate base models:
  # - "Qwen/Qwen2.5-1.5B-Instruct" (Strong multilingual & JSON support)
  # - "Qwen/Qwen2.5-3B-Instruct"
  # - "meta-llama/Llama-3.2-1B-Instruct" (Lightweight, fast)
  # - "meta-llama/Llama-3.2-3B-Instruct"
  # - "google/gemma-2-2b-it"
  model_id: "Qwen/Qwen2.5-1.5B-Instruct"
  torch_dtype: "bfloat16" # use "float16" on Google Colab T4
  trust_remote_code: false
  use_auth_token: true

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16" # use "float16" on T4

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules: "all-linear" # or ["q_proj", "v_proj"]
  task_type: "CAUSAL_LM"

data:
  train_file: "data/splits/train.jsonl"
  val_file: "data/splits/val.jsonl"
  test_file: "data/splits/test.jsonl"
  max_seq_length: 1024
  completion_only: true # compute loss on assistant response only

training:
  output_dir: "outputs/qlora_run"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002 # 2e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "none" # "wandb" or "tensorboard" or "none"
